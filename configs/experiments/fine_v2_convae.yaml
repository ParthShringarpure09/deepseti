# Fine V2 ConvAE main experiment: one predeclared configuration.
#
# Train on the frozen Fine V2 TRAIN split (15,120 real normal frames) only.
# Select the best checkpoint by CLEAN VALIDATION reconstruction loss only
# (never by synthetic benchmark performance). Evaluate the frozen synthetic
# VALIDATION development benchmark (1,200 paired examples) only after
# checkpoint selection. No hyperparameter sweep: this is the single
# predeclared configuration run by scripts/run_fine_v2_convae_experiment.py.

experiment:
  name: fine_v2_convae
  seed: 20261013

data:
  train_metadata: data/processed/fine_v2/train/metadata.csv
  train_root: data/processed/fine_v2/train
  validation_metadata: data/processed/fine_v2/validation/metadata.csv
  validation_root: data/processed/fine_v2/validation
  benchmark_dir: data/synthetic/fine_v2_validation
  benchmark_audit: results/benchmarks/fine_v2_validation_benchmark_audit.json
  final_test_dir: data/processed/fine_v2/test
  validation_access_config: configs/data/fine_v2_validation_access.yaml
  expected_train_frames: 15120
  expected_validation_frames: 3780
  expected_benchmark_examples: 1200
  frame_shape: [16, 4096]

model:
  name: conv_autoencoder_v3

training:
  epochs: 60
  batch_size: 64
  min_batch_size: 8
  learning_rate: 0.0001
  weight_decay: 0.0001
  optimizer: adamw
  loss: mse
  num_workers: 2
  early_stopping_patience: 12
  amp: true
  grad_clip_norm: 1.0

evaluation:
  top_fraction: 0.002
  bootstrap_resamples: 1000

output:
  checkpoint_dir: checkpoints
  checkpoint_name: fine_v2_convae_best.pt
  results_dir: results/experiments/fine_v2_convae
  figures_dir: results/experiments/fine_v2_convae/figures

pca_comparison:
  label: "Fine V2 PCA baseline"
  mean_auroc: 0.621
  mean_auprc: 0.654
  local_auroc: 0.696
  local_auprc: 0.744
