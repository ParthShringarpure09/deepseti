# Exact reproduction of the V1 training in notebooks/08_vit_mae.ipynb.
# Hyperparameters must not be changed for this config.
# Future ablations and V2 experiments use separate config files.

experiment:
  name: vit_mae_v1_gpu_reproduction
  seed: 42

model:
  frame_shape: [16, 4096]
  patch_size: [4, 64]
  channels: 1
  embed_dim: 128
  encoder_depth: 4
  encoder_heads: 4
  encoder_mlp_dim: 256
  decoder_dim: 64
  decoder_depth: 2
  decoder_heads: 4
  decoder_mlp_dim: 128
  mask_ratio: 0.75

data:
  manifest_path: configs/data/observations.csv
  raw_root: data/raw
  f_start: 2200.0
  f_stop: 2300.0
  time_window: 16
  freq_window: 4096

training:
  epochs: 125
  batch_size: 16
  learning_rate: 1.0e-4
  weight_decay: 0.05
  grad_clip: 1.0
  precision: float32
  # 0 workers matches the notebook default and avoids multiprocessing overhead
  # on a small dataset. Increase to 4+ only in a separate V2 config; a
  # spawn-safe top-level worker_init_fn is used automatically when > 0.
  dataloader_num_workers: 0

output:
  checkpoint_dir: results/checkpoints/vit_mae_v1_gpu_reproduction
  log_file: results/logs/vit_mae_v1_gpu_reproduction/train.log
