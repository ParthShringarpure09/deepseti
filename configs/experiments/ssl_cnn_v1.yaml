experiment:
  name: ssl_cnn_v1
  seed: 42

data:
  manifest: configs/data/scaleup_training_manifest.csv
  raw_root: data/raw
  train_split: train
  validation_split: validation
  f_start: 2200.0
  f_stop: 2300.0
  time_window: 16
  freq_window: 4096

augmentation:
  gaussian_sigma: 0.10

model:
  embedding_dim: 256
  pooled_frequency_bins: 32

projection:
  hidden_dim: 512
  output_dim: 256

vicreg:
  invariance_weight: 25.0
  variance_weight: 25.0
  covariance_weight: 1.0
  target_std: 1.0
  eps: 0.0001

training:
  epochs: 100
  batch_size: 64
  learning_rate: 0.0001
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  num_workers: 0

output:
  checkpoint_dir: results/checkpoints/ssl_cnn_v1
