[project]
name = "deepseti"
version = "0.1.0"
description = "Self-supervised anomaly detection for radio technosignature searches."
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "scikit-learn>=1.5",
    "torch>=2.5",
    "blimpy>=2.1.4",
    "setuptools<81",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "jupyterlab>=4.0",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepseti"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
